<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="60%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9900"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="tamilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Left card -->
  <rect x="60" y="80" width="520" height="500" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#4facfe" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Tamil heading -->
  <text x="100" y="155" font-family="Georgia, serif" font-size="62" fill="url(#tamilGrad)" filter="url(#glow)" opacity="0.9">&#2966;&#2993;&#3007;&#2997;&#3009;</text>
  <text x="100" y="228" font-family="Georgia, serif" font-size="62" fill="url(#tamilGrad)" filter="url(#glow)" opacity="0.9">Bridge</text>
  <rect x="100" y="248" width="200" height="3" rx="2" fill="url(#accent)"/>

  <!-- Subject pills -->
  <g font-family="'Courier New', monospace" font-size="13" fill="#a8d8ea">
    <rect x="100" y="272" width="68" height="26" rx="13" fill="#4facfe" fill-opacity="0.15" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="134" y="290" text-anchor="middle">DBMS</text>
    <rect x="178" y="272" width="72" height="26" rx="13" fill="#4facfe" fill-opacity="0.15" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="214" y="290" text-anchor="middle">Python</text>
    <rect x="260" y="272" width="56" height="26" rx="13" fill="#4facfe" fill-opacity="0.15" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="288" y="290" text-anchor="middle">Java</text>
    <rect x="326" y="272" width="52" height="26" rx="13" fill="#4facfe" fill-opacity="0.15" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="352" y="290" text-anchor="middle">DSA</text>
    <rect x="388" y="272" width="44" height="26" rx="13" fill="#4facfe" fill-opacity="0.15" stroke="#4facfe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="410" y="290" text-anchor="middle">OS</text>
    <rect x="100" y="308" width="116" height="26" rx="13" fill="#ff9900" fill-opacity="0.12" stroke="#ff9900" stroke-opacity="0.5" stroke-width="1"/>
    <text x="158" y="326" text-anchor="middle" fill="#ffcc80">Networks</text>
    <rect x="226" y="308" width="68" height="26" rx="13" fill="#ff9900" fill-opacity="0.12" stroke="#ff9900" stroke-opacity="0.5" stroke-width="1"/>
    <text x="260" y="326" text-anchor="middle" fill="#ffcc80">AI / ML</text>
  </g>

  <!-- Code snippet -->
  <rect x="100" y="352" width="430" height="112" rx="8" fill="#0d1117" fill-opacity="0.92" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="120" cy="370" r="5" fill="#ff5f56"/>
  <circle cx="136" cy="370" r="5" fill="#ffbd2e"/>
  <circle cx="152" cy="370" r="5" fill="#27c93f"/>
  <text x="120" y="397" font-family="'Courier New', monospace" font-size="12" fill="#79c0ff">python -m agent.app \</text>
  <text x="120" y="414" font-family="'Courier New', monospace" font-size="12" fill="#a5f3a5">  "DBMS &#2958;&#2985;&#3021;&#2993;&#3006;&#2994;&#3021; &#2958;&#2985;&#3021;&#2985;?" \</text>
  <text x="120" y="431" font-family="'Courier New', monospace" font-size="12" fill="#79c0ff">  --lang ta</text>
  <text x="120" y="450" font-family="'Courier New', monospace" font-size="11" fill="#6e7681">&#10132; &#2980;&#2990;&#3007;&#2996;&#3021;&#2994;&#3007;&#2994;&#3021; &#2997;&#3007;&#2995;&#2965;&#3021;&#2965;&#2990;&#3021;...</text>

  <!-- Features -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#c9d1d9">
    <text x="108" y="496">&#10022;  Explains in Tamil, English, or bilingual</text>
    <text x="108" y="518">&#10022;  Critic reviews before you see the answer</text>
    <text x="108" y="540">&#10022;  Safety hook — code, not model, writes crisis response</text>
    <text x="108" y="562">&#10022;  45 curated guidance items, 7 CS subjects</text>
  </g>

  <!-- Right: architecture flow -->
  <g transform="translate(650, 90)">
    <rect x="115" y="0" width="240" height="48" rx="8" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="235" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#58a6ff">Student Input</text>
    <text x="235" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Tamil / English / mixed</text>

    <line x1="235" y1="48" x2="235" y2="76" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <polygon points="229,70 235,82 241,70" fill="#58a6ff" opacity="0.6"/>

    <rect x="75" y="82" width="320" height="52" rx="8" fill="#3d1a00" stroke="#ff9900" stroke-width="1.5"/>
    <text x="235" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff9900" font-weight="bold">Safety Gate (Hook)</text>
    <text x="235" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ffcc80">crisis &#183; authority &#183; inject &#183; scope</text>

    <line x1="235" y1="134" x2="235" y2="162" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <polygon points="229,156 235,168 241,156" fill="#3fb950" opacity="0.6"/>

    <rect x="75" y="168" width="320" height="48" rx="8" fill="#0a3d20" stroke="#3fb950" stroke-width="1.5"/>
    <text x="235" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3fb950" font-weight="bold">Planner Agent</text>
    <text x="235" y="206" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#7ee787">lookup_guidance(@tool)</text>

    <line x1="235" y1="216" x2="235" y2="244" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <polygon points="229,238 235,250 241,238" fill="#d2a8ff" opacity="0.6"/>

    <rect x="75" y="250" width="320" height="48" rx="8" fill="#1a0d2e" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="235" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d2a8ff" font-weight="bold">Critic Agent</text>
    <text x="235" y="288" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#c9b1ff">language &#183; citations &#183; facts</text>

    <path d="M 395 274 Q 448 274 448 216 Q 448 192 395 192" fill="none" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
    <polygon points="389,187 395,198 401,187" fill="#ffa657" opacity="0.7"/>
    <text x="458" y="238" font-family="Arial, sans-serif" font-size="11" fill="#ffa657">retry</text>
    <text x="456" y="254" font-family="Arial, sans-serif" font-size="11" fill="#ffa657">&#8804; 2&#215;</text>

    <line x1="235" y1="298" x2="235" y2="326" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
    <polygon points="229,320 235,332 241,320" fill="#58a6ff" opacity="0.6"/>

    <rect x="75" y="332" width="320" height="48" rx="8" fill="#0d2340" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="235" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#58a6ff" font-weight="bold">ExplainAnswer (Pydantic)</text>
    <text x="235" y="370" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">answer &#183; steps &#183; citations &#183; lang</text>

    <rect x="75" y="406" width="320" height="38" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="180" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6e7681">Built with</text>
    <text x="290" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff9900" font-weight="bold">Strands Agents SDK</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="598" width="1280" height="122" fill="#0d1117" fill-opacity="0.88"/>
  <rect x="0" y="598" width="1280" height="3" fill="url(#accent)"/>

  <text x="100" y="656" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="white" filter="url(#textGlow)">ArivuBridge</text>
  <text x="100" y="656" font-family="'Arial Black', Arial, sans-serif" font-size="48" font-weight="900" fill="url(#tamilGrad)">ArivuBridge</text>
  <text x="100" y="688" font-family="Arial, sans-serif" font-size="17" fill="#8b949e">Tamil AI Learning Companion  &#183;  </text>
  <text x="457" y="688" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#ff9900">Learn in your language. Understand with confidence.</text>

  <rect x="978" y="614" width="264" height="78" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ff9900" stroke-width="1.5"/>
  <text x="1110" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">Strands SDK: Workshop to Ship</text>
  <text x="1110" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff9900" font-weight="bold">AWS Builder Center Hackathon</text>
  <text x="1110" y="679" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">Education track &#183; Oct&#8211;Nov 2026</text>
</svg>
